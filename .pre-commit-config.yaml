repos:
  - repo: local
    hooks:
      - id: trufflehog
        name: TruffleHog
        description: Detect secrets in your data.
        entry: bash -c 'trufflehog git --no-update --since-commit HEAD --trust-local-git-config --fail file://.'
        language: system
        stages: ["pre-commit", "pre-push"]
        pass_filenames: false
